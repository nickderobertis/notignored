# yaml-language-server: $schema=https://raw.githubusercontent.com/nickderobertis/llmlint/main/assets/llmlint.schema.json
#
# The LLM-judge tier — separate from the deterministic `just check` gate.
# Run with `just lint-llm` (or `just lint-llm-diff` for the merge-base
# diff); the diff-scoped run is the blocking PR check, not part of `check`.
# Rules come from the pinned plugins below; tune one in place with
# `override: true`. Bump a plugin's `@version` pin to pull new rules.
files:
  # No `include`: llmlint lints the whole tree (exclude + .gitignore honored).
  # List committed files that shouldn't be judged (lock files, generated output).
  exclude:
    - "**/.git/**"
    # Deliberately malformed input, not code: the parity fixtures hold
    # suppressions that the tools they mirror reject, including llmlint
    # directives naming rules this config does not define and a block left
    # unclosed on purpose. Judging them — or running `check-ignores` over them —
    # reads test data as a claim about the repo.
    - "tests/fixtures/**"
    # Generated output: the golden reports are whatever the CLI printed, so they
    # quote the fixtures' directives verbatim.
    - "tests/golden/**"
    # Directive text as subject matter. `check-ignores` scans raw lines, so the
    # module that implements llmlint's own syntax — its doc table and its ~30
    # test literals, several deliberately malformed — reads as a file full of
    # broken suppressions. The deterministic gate still covers it in full
    # (clippy, and unit tests over every branch); this only keeps the LLM tier
    # from re-litigating test data.
    - "src/tools/llmlint.rs"
    # Composed verbatim by the create-repo skill (`compose_repo_plan.py
    # --llmlint-config` and `assets/setup-llmlint.sh.template`). Editing them to
    # local taste forks them from the template and loses the ability to
    # re-compose, so they are generated output, not repo-authored code.
    - "oneharness.toml"
    - "scripts/setup-llmlint.sh"
rationales: true
# No `agents` block: the harness/model are NOT pinned here. `oneharness.toml`
# (composed alongside this file) selects them in fallback mode — codex + gpt-5.5
# primary, claude-code + opus-4.8 secondary — so a Claude Code session falls
# through to claude-code with no config edit. Leaving the harness unset is what
# lets that fallback (or an ONEHARNESS_<FIELD> env override) decide.
plugins:
  - "https://raw.githubusercontent.com/nickderobertis/llmlint/main/assets/config_lint.yml@1"
  - "https://raw.githubusercontent.com/nickderobertis/dero-skills/main/skills/bootstrap/create-repo/assets/llmlint/base.llmlint.yml@1"
  - "https://raw.githubusercontent.com/nickderobertis/dero-skills/main/skills/bootstrap/create-repo/assets/llmlint/shapes/cli.llmlint.yml@1"
  - "https://raw.githubusercontent.com/nickderobertis/dero-skills/main/skills/bootstrap/create-repo/assets/llmlint/languages/rust.llmlint.yml@1"
  - "https://raw.githubusercontent.com/nickderobertis/dero-skills/main/skills/bootstrap/create-repo/assets/llmlint/ci.llmlint.yml@1"
