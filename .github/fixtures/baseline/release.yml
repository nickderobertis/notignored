name: Release
on:
  push:
    tags:
      - v*.*.*
permissions: {}
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
jobs:
  guard:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "CARGO_REGISTRY_TOKEN not set; skipping crates.io publish." >&2
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: taiki-e/install-action@v2
        with:
          tool: just,nextest,cargo-llvm-cov
      - run: just bootstrap
      - run: just check
  upload:
    name: upload (${{ matrix.target }})
    needs: test
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Check the Release is still a draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/github-release.sh await-draft --tag "$GITHUB_REF_NAME"
      - name: Build, archive, checksum, and upload
        env:
          RUSTFLAGS: -D warnings
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: notignored
          target: ${{ matrix.target }}
          archive: $bin-$tag-$target
          checksum: sha256
          include: README.md,LICENSE,CHANGELOG.md
          token: ${{ secrets.GITHUB_TOKEN }}
  publish-release:
    needs: upload
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish the draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/github-release.sh publish --tag "$GITHUB_REF_NAME"
      - name: Read the Release back and require it immutable
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/github-release.sh verify-immutable --tag "$GITHUB_REF_NAME"
  verify-install:
    name: verify-install (${{ matrix.os }})
    needs: publish-release
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - macos-15-intel
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Check the release tag is a version
        run: >
          if ! [[ "$GITHUB_REF_NAME" =~
          ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::release tag '$GITHUB_REF_NAME' is not a vX.Y.Z version tag"
            exit 1
          fi
      - name: Install the published release with scripts/install.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >
          bash scripts/retry-install.sh \
            --label "GitHub Release notignored $GITHUB_REF_NAME on $RUNNER_OS/$RUNNER_ARCH" \
            --action "check the release's assets — upload may have attached no archive or no .sha256 for this target" \
            -- sh scripts/install.sh --version "$GITHUB_REF_NAME" --to "$RUNNER_TEMP/notignored-bin"
          echo "$RUNNER_TEMP/notignored-bin" >> "$GITHUB_PATH"
      - name: Smoke-test what the Release served
        run: |
          ver="${GITHUB_REF_NAME#v}"
          bash scripts/smoke-published.sh \
            --expect-version "$ver" \
            --label "GitHub Release notignored $ver on $RUNNER_OS/$RUNNER_ARCH"
  publish-crate:
    needs:
      - guard
      - test
    if: ${{ needs.guard.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Publish (skip a version already live)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          RUSTFLAGS: -D warnings
        run: >
          ver="$(cargo metadata --no-deps --format-version 1 \
                 | sed -n 's/.*"name":"notignored","version":"\([^"]*\)".*/\1/p')"
          if curl -fsSL "https://index.crates.io/no/ti/notignored" 2>/dev/null \
             | grep -q "\"vers\":\"$ver\""; then
            echo "notignored $ver is already on crates.io; nothing to publish."
            exit 0
          fi

          cargo publish --locked
  build-wheels:
    name: build-wheels (${{ matrix.target }})
    needs: test
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build wheel
        env:
          RUSTFLAGS: -D warnings
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist
          manylinux: auto
          maturin-version: v1.14.1
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: dist
  publish-pypi:
    needs: build-wheels
    if: ${{ vars.PYPI_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Require the publishing credential
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: >
          if [ -z "${PYPI_TOKEN:-}" ]; then
            echo "::error::PYPI_PUBLISH is on but the PYPI_TOKEN secret is empty; add it (see gh-secrets.json) or unset PYPI_PUBLISH" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          password: ${{ secrets.PYPI_TOKEN }}
          skip-existing: true
  verify-pypi:
    name: verify-pypi (${{ matrix.os }})
    needs: publish-pypi
    if: ${{ vars.PYPI_PUBLISH == 'true' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - macos-15-intel
          - windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the release tag is a version
        run: >
          # A glob cannot say "digits and nothing else" —
          `v[0-9]*.[0-9]*.[0-9]*`

          # would take `v1x.2y.3z` — so match the whole tag against a pattern.

          if ! [[ "$GITHUB_REF_NAME" =~
          ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::release tag '$GITHUB_REF_NAME' is not a vX.Y.Z version tag"
            exit 1
          fi
      - name: Install the published wheel
        run: >
          ver="${GITHUB_REF_NAME#v}"

          bash scripts/retry-install.sh \
            --label "PyPI notignored-cli $ver on $RUNNER_OS/$RUNNER_ARCH" \
            --action "check https://pypi.org/project/notignored-cli/ — publish-pypi may have uploaded no wheel for this platform" \
            -- pip install --no-cache-dir "notignored-cli==${ver}"
      - name: Smoke-test what PyPI served
        run: |
          ver="${GITHUB_REF_NAME#v}"
          bash scripts/smoke-published.sh \
            --expect-version "$ver" \
            --label "PyPI notignored-cli $ver on $RUNNER_OS/$RUNNER_ARCH"
  build-python-sdk:
    needs: test
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Stamp the crate version in and build the distributions
        run: |
          pkgdir="$(node scripts/python-sdk-build.mjs --out python/dist)"
          uv build --out-dir python-sdk-dist "$pkgdir"
      - uses: actions/upload-artifact@v4
        with:
          name: python-sdk
          path: python-sdk-dist/*
  publish-python-sdk:
    needs:
      - publish-pypi
      - build-python-sdk
    if: ${{ vars.PYPI_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Require the publishing credential
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: >
          if [ -z "${PYPI_TOKEN:-}" ]; then
            echo "::error::PYPI_PUBLISH is on but the PYPI_TOKEN secret is empty; add it (see gh-secrets.json) or unset PYPI_PUBLISH" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: python-sdk
          path: python-sdk-dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python-sdk-dist
          password: ${{ secrets.PYPI_TOKEN }}
          skip-existing: true
  verify-python-sdk:
    needs: publish-python-sdk
    if: ${{ vars.PYPI_PUBLISH == 'true' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the release tag is a version
        run: >
          if ! [[ "$GITHUB_REF_NAME" =~
          ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::release tag '$GITHUB_REF_NAME' is not a vX.Y.Z version tag"
            exit 1
          fi
      - name: Install the published SDK
        run: >
          ver="${GITHUB_REF_NAME#v}"

          bash scripts/retry-install.sh \
            --label "PyPI notignored-sdk $ver on $RUNNER_OS/$RUNNER_ARCH" \
            --action "check https://pypi.org/project/notignored-sdk/ and https://pypi.org/project/notignored-cli/ — the SDK pins the CLI at the same version, so either one missing fails this" \
            -- pip install --no-cache-dir "notignored-sdk==${ver}"
      - name: Scan with the CLI the SDK brought
        run: >
          ver="${GITHUB_REF_NAME#v}"

          python - "$ver" <<'PY'

          import sys

          from importlib.metadata import version

          from pathlib import Path

          from tempfile import TemporaryDirectory


          from notignored_sdk import Scope, Tool, scan


          expected = sys.argv[1]

          assert version("notignored-sdk") == expected,
          version("notignored-sdk")

          assert version("notignored-cli") == expected,
          version("notignored-cli")


          with TemporaryDirectory() as tmp:
              Path(tmp, "app.py").write_text("u = URL  # noqa: E501  # long URL\n")
              report = scan(cwd=tmp)

          assert report.version == 1, report

          assert [d.tool for d in report.ignores] == [Tool.RUFF], report

          assert report.ignores[0].rules == ("E501",), report

          assert report.ignores[0].reason == "long URL", report

          assert report.ignores[0].scope is Scope.LINE, report

          PY

          echo "PyPI install + packaged-CLI smoke test passed for notignored-sdk
          $ver"
  build-npm:
    name: build-npm (${{ matrix.target }})
    needs: test
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the platform binary
        env:
          TARGET: ${{ matrix.target }}
          RUSTFLAGS: -D warnings
        run: |
          rustup target add "$TARGET"
          cargo build --release --locked --target "$TARGET"
      - name: Assemble and pack the platform npm package
        env:
          TARGET: ${{ matrix.target }}
        run: >
          bin="target/$TARGET/release/notignored"

          [ -f "$bin" ] || bin="${bin}.exe"

          pkgdir="$(node scripts/npm-build.mjs platform --target "$TARGET"
          --binary "$bin" --out npm/dist)"

          mkdir -p npm-artifacts

          (cd "$pkgdir" && npm pack --pack-destination
          "$GITHUB_WORKSPACE/npm-artifacts")
      - uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.target }}
          path: npm-artifacts/*.tgz
  build-sdk-npm:
    needs: test
    permissions:
      contents: read
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: extractions/setup-just@v3
      - name: Install the pinned JS toolchain
        run: just setup-js
      - name: Build and pack the version-stamped SDK
        run: >
          just nx run notignored-sdk-npm:build

          pkgdir="$(node npm/notignored-sdk/scripts/pack.mjs --out npm/dist)"

          mkdir -p sdk-artifact

          (cd "$pkgdir" && npm pack --pack-destination
          "$GITHUB_WORKSPACE/sdk-artifact")
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-npm
          path: sdk-artifact/*.tgz
  publish-npm:
    needs:
      - build-npm
      - build-sdk-npm
    permissions:
      contents: read
    if: ${{ vars.NPM_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Require the publishing credential
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: >
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "::error::NPM_PUBLISH is on but the NPM_TOKEN secret is empty; add it (see gh-secrets.json) or unset NPM_PUBLISH" >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          pattern: npm-*
          path: npm-artifacts
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdk-npm
          path: sdk-artifact
      - name: Publish the platform packages, then the launcher, then the SDK
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: >
          # Platform packages first: the launcher's optionalDependencies pin
          their

          # exact versions, so they must exist for a later install to resolve.

          # Glob against an ABSOLUTE base so each argument is an absolute path —

          # npm reads a bare `dir/file.tgz` as a `user/repo` GitHub spec and
          tries

          # to git-clone it.

          for tgz in "$GITHUB_WORKSPACE"/npm-artifacts/*.tgz; do
            bash scripts/publish-npm.sh "$tgz"
          done

          # The launcher (notignored-cli) carries no binary, so it needs no

          # prebuilt target — just the version-stamped manifest.

          launcher="$(node scripts/npm-build.mjs launcher --out npm/dist)"

          bash scripts/publish-npm.sh "$launcher"

          # The SDK last: it depends on nothing here, but a consumer following

          # its README installs the launcher alongside it, so that has to
          resolve

          # by the time the SDK is on the registry.

          bash scripts/publish-npm.sh "$GITHUB_WORKSPACE"/sdk-artifact/*.tgz
  verify-npm:
    name: verify-npm (${{ matrix.os }})
    needs: publish-npm
    if: ${{ vars.NPM_PUBLISH == 'true' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - macos-15-intel
          - windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check the release tag is a version
        run: >
          # A glob cannot say "digits and nothing else" —
          `v[0-9]*.[0-9]*.[0-9]*`

          # would take `v1x.2y.3z` — so match the whole tag against a pattern.

          if ! [[ "$GITHUB_REF_NAME" =~
          ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::release tag '$GITHUB_REF_NAME' is not a vX.Y.Z version tag"
            exit 1
          fi
      - name: Install the published package
        run: >
          ver="${GITHUB_REF_NAME#v}"

          bash scripts/retry-install.sh \
            --label "npm notignored-cli $ver on $RUNNER_OS/$RUNNER_ARCH" \
            --action "check https://www.npmjs.com/package/notignored-cli and the platform package the last attempt names — publish-npm may not have published it, or the registry may not serve it yet" \
            -- bash scripts/npm-install-probe.sh --version "$ver" --global "notignored-cli@${ver}"
      - name: Smoke-test what npm served
        run: |
          ver="${GITHUB_REF_NAME#v}"
          bash scripts/smoke-published.sh \
            --expect-version "$ver" \
            --label "npm notignored-cli $ver on $RUNNER_OS/$RUNNER_ARCH"
      - name: Install the SDK from npm and scan through its packaged CLI
        run: >
          ver="${GITHUB_REF_NAME#v}"

          work="$(mktemp -d)"

          cd "$work"

          npm init --yes >/dev/null

          # An absolute path: this runs from a temp directory, not the checkout.

          # The same probe as the global install: the launcher installed beside

          # the SDK skips an unserved platform package just the same.

          bash "$GITHUB_WORKSPACE/scripts/retry-install.sh" \
            --label "npm notignored-sdk $ver on $RUNNER_OS/$RUNNER_ARCH" \
            --action "check https://www.npmjs.com/package/notignored-sdk and the platform package the last attempt names — publish-npm publishes the SDK last, so it propagates last too" \
            -- bash "$GITHUB_WORKSPACE/scripts/npm-install-probe.sh" --version "$ver" "notignored-sdk@${ver}" "notignored-cli@${ver}"
          printf 'x = 1  # noqa: E501  # smoke test\n' > app.py

          node --input-type=module -e '
            import { scan } from "notignored-sdk";
            const report = await scan(["app.py"]);
            const [directive] = report.ignores;
            if (report.ignores.length !== 1 || directive.tool !== "ruff"
                || directive.rules[0] !== "E501" || directive.reason !== "smoke test") {
              throw new Error(`installed SDK returned ${JSON.stringify(report)}`);
            }
          '

          echo "npm install + packaged-CLI smoke test passed for notignored-sdk
          $ver"
  major-tag:
    needs:
      - upload
      - publish-release
      - verify-install
      - publish-crate
      - publish-pypi
      - verify-pypi
      - publish-python-sdk
      - verify-python-sdk
      - publish-npm
      - verify-npm
    if: ${{ !failure() && !cancelled() && needs.publish-release.result == 'success'
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move the floating major tag onto this release
        run: bash scripts/update-major-tag.sh --tag "$GITHUB_REF_NAME"
