name: Visual docs (reusable)
on:
  workflow_call:
    inputs:
      capture-command:
        description: Shell that writes $SHOTS_OUT/captures.json plus its PNGs.
        type: string
        required: true
      container:
        description: Container image the capture runs in (pin to your Playwright version).
        type: string
        default: mcr.microsoft.com/playwright:v1.60.0-noble
      screencomp-version:
        description: screencomp release to install on the host, or "latest".
        type: string
        default: latest
      arches:
        description: ADVANCED / testing override for the capture arch matrix, as a JSON
          array string (e.g. '["x86_64"]'). Leave empty (the default) for the
          normal single-source flow, where the matrix is read from
          [capture].arches in the committed screencomp.toml. Set it only when
          there is no committed config to read — e.g. screencomp's own
          reusable-workflow self-test, which has no repo-level screencomp.toml.
        type: string
        default: ""
      gallery-title:
        description: Title for the generated gallery.
        type: string
        default: Visual docs
      verify:
        description: Capture twice and require byte-identical output (the
          reproducibility gate).
        type: boolean
        default: true
      pages:
        description: Deploy the gallery to GitHub Pages (canonical on push, per-PR
          preview on PRs).
        type: boolean
        default: true
      publish:
        description: "Perform external side effects: post the PR comment, push the
          regenerated manifest, and deploy Pages. Set false to run every step
          but produce no side effects — a dry run for previewing or for testing
          the workflow."
        type: boolean
        default: true
      gh-pages-maintenance:
        description: "Keep the gh-pages branch bounded: delete a PR's /pr-<n>/ preview
          when the PR closes (cleanup-preview) and prune gh-pages history to the
          most recent gallery versions on a schedule (prune-history; see
          gh-pages-history-versions). On by default — set false to opt out (e.g.
          you serve Pages from a source other than the gh-pages branch, or prune
          it with your own tooling). Only fires when the caller also forwards
          the matching `pull_request: closed` and `schedule:` triggers; the
          `screencomp init` scaffold does. Also gated on pages + publish, so dry
          runs skip it."
        type: boolean
        default: true
      gh-pages-history-versions:
        description: How many of the most recent gallery versions (gh-pages commits) the
          scheduled prune-history job keeps intact; everything older is
          collapsed into a single base commit. 0 collapses the branch to one
          fresh commit. Ignored when gh-pages-maintenance is off.
        type: number
        default: 20
      fail-on-drift:
        description: Fail the job when the capture drifts from the committed baseline
          manifest (the strict gate, default). The developer regenerates and
          commits the baseline locally with the pre-push guard; CI is the
          backstop that goes red on anything they missed. Set false to
          auto-accept drift instead — a loud warning, not a failed check (the
          lighter model, where changes can slip through unnoticed).
        type: boolean
        default: true
      update-manifest:
        description: "Regenerate the baseline manifest and, on a PR when publishing,
          push it to the PR branch. Off by default: under the strict gate the
          developer owns the baseline. Turn it on (with fail-on-drift:false) for
          the CI-auto-accept model, where CI moves the baseline for you."
        type: boolean
        default: false
      comment-base-ref:
        description: Git ref whose committed manifest is the PR comment's "Before".
          Defaults to the PR base branch, so the sticky comment shows the
          intended before/after even though classify gates against the
          (already-updated) committed baseline. Set to a single space or an
          unknown ref to fall back to diffing the committed manifest.
        type: string
        default: ""
    secrets:
      push-token:
        description: Token that can trigger workflows, used to push the regenerated
          manifest to the PR branch. Only needed when the repo enforces required
          status checks (the default GITHUB_TOKEN cannot trigger runs). See the
          README's "Branch protection".
        required: false
concurrency:
  group: visual-docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  arches:
    if: ${{ github.event_name != 'schedule' && github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: nickderobertis/screencomp@v0
        with:
          version: ${{ inputs.screencomp-version }}
      - name: Resolve [capture].arches
        id: read
        shell: bash
        env:
          ARCHES_OVERRIDE: ${{ inputs.arches }}
        run: >
          set -euo pipefail

          if [ -n "$ARCHES_OVERRIDE" ]; then
            matrix="$ARCHES_OVERRIDE"   # explicit override (no committed config to read)
          else
            matrix="$(screencomp arches --format json)"
          fi

          if [ -z "$matrix" ] || [ "$matrix" = "[]" ]; then
            echo "::error::no [capture].arches configured in screencomp.toml; add e.g. arches = [\"x86_64\"], or pass the workflow's 'arches' input" >&2
            exit 1
          fi

          echo "matrix=$matrix" >>"$GITHUB_OUTPUT"
  capture:
    needs: arches
    if: ${{ github.event_name != 'schedule' && github.event.action != 'closed' }}
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.arches.outputs.matrix) }}
    runs-on: ${{ (matrix.arch == 'arm64' || matrix.arch == 'aarch64') &&
      'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    container: ${{ inputs.container }}
    permissions:
      contents: read
    env:
      SHOTS_OUT: shots/current/${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - name: Log runner CPU (cross-CPU anti-aliasing drift diagnostics)
        run: >
          echo "::group::Runner CPU ($(uname -m))"

          grep -E -m1 'model name' /proc/cpuinfo \
            || grep -E 'Model|CPU implementer|CPU part' /proc/cpuinfo | sort -u \
            || true
          echo "::endgroup::"
      - name: Capture screenshots
        run: ${{ inputs.capture-command }}
      - name: Capture again for the reproducibility gate
        if: ${{ inputs.verify }}
        env:
          SHOTS_OUT: shots/verify/${{ matrix.arch }}
        run: ${{ inputs.capture-command }}
      - uses: actions/upload-artifact@v4
        with:
          name: screencomp-shots-${{ matrix.arch }}
          path: shots
          if-no-files-found: error
          retention-days: 1
  report:
    needs:
      - arches
      - capture
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.arches.outputs.matrix) }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.push-token || github.token }}
      - uses: nickderobertis/screencomp@v0
        with:
          version: ${{ inputs.screencomp-version }}
      - uses: actions/download-artifact@v4
        with:
          name: screencomp-shots-${{ matrix.arch }}
          path: shots
      - uses: nickderobertis/screencomp/visual-docs@v0
        with:
          arch: ${{ matrix.arch }}
          gallery-title: ${{ inputs.gallery-title }}
          verify-second: ${{ inputs.verify && 'shots/verify' || '' }}
          pages: ${{ inputs.pages }}
          publish: ${{ inputs.publish }}
          fail-on-drift: ${{ inputs.fail-on-drift }}
          update-manifest: ${{ inputs.update-manifest }}
          comment-base-ref: ${{ inputs.comment-base-ref }}
          github-token: ${{ secrets.push-token || github.token }}
  cleanup-preview:
    if: ${{ inputs.pages && inputs.publish && inputs.gh-pages-maintenance &&
      github.event_name == 'pull_request' && github.event.action == 'closed' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: nickderobertis/screencomp/gh-pages-maintenance@v0
        with:
          mode: cleanup
          pr: ${{ github.event.pull_request.number }}
          token: ${{ secrets.push-token || github.token }}
  prune-history:
    if: ${{ inputs.pages && inputs.publish && inputs.gh-pages-maintenance &&
      github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: nickderobertis/screencomp/gh-pages-maintenance@v0
        with:
          mode: prune
          keep-versions: ${{ inputs.gh-pages-history-versions }}
          token: ${{ secrets.push-token || github.token }}
