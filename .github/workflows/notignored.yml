name: notignored

# Dogfooding: every pull request here is reviewed by the action this repository
# ships, built from the branch's own source. A fixture-heavy change is a feature —
# the comment it produces is the demo.
#
# Deliberately NOT a required check (see AGENTS.md): it is skipped on fork pull
# requests, whose read-only token cannot upsert a comment, and a required context
# that never reports would block them forever.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: notignored-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suppressions:
    # A fork's pull request is granted a read-only token, so the upsert would
    # fail on something the contributor has no way to fix.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # `version: local` builds the action's own source with `cargo install`, which
    # otherwise builds in a throwaway target directory the cache never sees — a
    # cold release build on every pull request. Pointing it at the workspace
    # target directory is what makes the cache below apply to it. Job-level so
    # the composite action's own steps inherit it.
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4
        with:
          # --diff resolves the base branch, which a shallow checkout omits.
          fetch-depth: 0
      # Keyed on Cargo.lock and the toolchain, so a warm run reuses every
      # dependency and rebuilds only this branch's own crate.
      - uses: Swatinem/rust-cache@v2
      - uses: ./
        with:
          version: local
