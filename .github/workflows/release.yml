name: Release

# Build, archive, checksum, and publish everything a published GitHub Release
# ships: the cross-platform binaries, the PyPI wheels, and the npm packages.
#
# The Release is what fires this: release-plz (see release-plz.yml) computes the
# version, writes the changelog and manifests, tags `vX.Y.Z`, and cuts the
# Release. Versioning and building stay separate workflows, joined only by that
# Release. Creating a Release by hand in the GitHub UI is the supported manual
# fallback — it triggers this same validated path.
#
# release-plz authenticates with a PAT precisely so that Release fires this
# workflow — a tag or release created by the default GITHUB_TOKEN triggers
# nothing, and the release would silently ship no artifacts.
#
#   * test          — the complete deterministic gate, so untested artifacts
#                     never publish.
#   * upload        — build each target on a native runner and attach the archive
#                     + sha256 checksum to the Release (what scripts/install.sh
#                     downloads).
#   * verify-install— install that Release with scripts/install.sh, the way the
#                     README one-liner and the GitHub Action's default do, and
#                     smoke-test what it put on PATH. Ungated: the Release
#                     publishes whatever the registry variables say.
#   * publish-crate — idempotent crates.io publish; self-activates the day
#                     CARGO_REGISTRY_TOKEN is set.
#   * build-wheels  — wrap the prebuilt binary in per-platform PyPI wheels with
#                     maturin (the ruff/uv pattern). Runs unconditionally, so a
#                     packaging break reddens the release even while publishing
#                     is switched off.
#   * publish-pypi  — upload those wheels to notignored-cli with the PYPI_TOKEN
#                     secret, gated on the PYPI_PUBLISH repo variable.
#   * verify-pypi   — on Linux, both macOS architectures, and Windows,
#                     pip-install the exact version just published and run
#                     scripts/smoke-published.sh over it.
#   * build-python-sdk / publish-python-sdk / verify-python-sdk — the same three
#                     steps for notignored-sdk, the pure-Python client.
#                     scripts/python-sdk-build.mjs stamps Cargo.toml's version
#                     and pins notignored-cli to it exactly; publishing waits on
#                     publish-pypi so that pin is resolvable.
#   * build-npm     — wrap the same prebuilt binary in per-platform npm packages
#                     (notignored-cli-<platform>-<arch>) via scripts/npm-build.mjs.
#                     Runs unconditionally, same rationale as the wheels.
#   * build-sdk-npm — compile the TypeScript SDK and stamp Cargo.toml's version
#                     into it (npm/notignored-sdk/scripts/pack.mjs). Carries no
#                     binary, so it needs no target matrix. Unconditional too.
#   * publish-npm   — publish the platform packages, then the launcher that
#                     depends on them, then the SDK, with the NPM_TOKEN secret,
#                     gated on the NPM_PUBLISH repo variable.
#   * verify-npm    — the same, on the same matrix, for `npm install -g` and for
#                     `npm install notignored-sdk`.
#   * major-tag     — move the floating `v0` (the ref README tells action
#                     consumers to use) onto this release, LAST, after every
#                     publish and verify job. See scripts/update-major-tag.sh.
#
# Every verify job runs the version at publish time only. `published-smoke.yml`
# runs the identical scripts against whatever the registries and the Release
# serve as `latest`, on a weekly schedule, so rot between releases surfaces
# without one.
#
# The version is never written here: every artifact takes it from Cargo.toml
# (maturin via `dynamic = ["version"]`, npm via scripts/npm-build.mjs), so
# release-plz stays the single version driver.
#
# llmlint: ignore-file[changed_behavior_has_e2e] the publish and verify jobs are steps
# in a GitHub Actions job on a published Release: installing an exact version until the
# registry serves it, and smoke-testing what it installed. Driving them from a test
# would mean standing up a runner and a public release, or replacing both with a
# simulation — and a simulation is what would then be under test. They are proven the
# only way they can be, by running on every real release, and everything they call that
# *can* be driven locally is: scripts/publish-npm.sh in tests/e2e/publish_npm.rs,
# scripts/retry-install.sh in tests/e2e/retry_install.rs, and both packages'
# build-and-install in tests/e2e/packaging.rs.
#
# llmlint: ignore-file[live_tier_compiles_and_requires_credential] the publish and
# verify jobs are deliberately switched by the PYPI_PUBLISH / NPM_PUBLISH repository
# variables, which is the operator's control over whether a Release reaches a public
# registry at all — a fork, or a repo whose tokens are not provisioned, must not
# publish. The two properties the rule protects are still held: the tier *compiles*
# on every release, because build-wheels and build-npm are ungated on purpose, so a
# packaging break reddens a release even while publishing is off; and it *requires*
# its credential, because each publish job fails fast with the secret to set when its
# variable is on and the token is empty. What cannot be had is a live publish that
# runs unconditionally — that is a product decision, not a missing check.

on:
  release:
    types: [published]

# Nothing by default: the jobs that read the repository ask for `contents: read`
# themselves, and the three that only move artifacts between jobs or install from
# a public registry get a token with no scopes at all.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # crates.io publishing self-activates once the CARGO_REGISTRY_TOKEN secret
  # exists. `secrets` cannot be read in a job `if:`, so read it into an env var
  # here and expose its presence as an output the publish job gates on. The PyPI
  # and npm jobs need no such guard: they gate on repository *variables*, which
  # `if:` can read directly.
  guard:
    runs-on: ubuntu-latest
    # Reads whether a secret is set and writes a job output — no repo access.
    permissions: {}
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "CARGO_REGISTRY_TOKEN not set; skipping crates.io publish." >&2
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  # Re-gate the release on the same checks CI enforces, so a release can never
  # publish an artifact that would not pass the gate.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: taiki-e/install-action@v2
        with:
          tool: just,nextest,cargo-llvm-cov
      - run: just bootstrap
      - run: just check

  upload:
    name: upload (${{ matrix.target }})
    needs: test
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners per target so nothing needs cross-compilation.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build, archive, checksum, and upload
        # Same rule as the wheel and npm builds: four of these targets are
        # compiled nowhere else, so a warning specific to one has no other job
        # to surface it.
        env:
          RUSTFLAGS: "-D warnings"
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: notignored
          target: ${{ matrix.target }}
          # The asset-naming contract. scripts/install.sh spells this template
          # identically (see its ASSET_NAME_TEMPLATE marker) and
          # tests/install_contract.rs fails the build if the two ever drift.
          archive: $bin-$tag-$target
          checksum: sha256
          include: README.md,LICENSE,CHANGELOG.md
          # Uploading an asset to a release that already exists triggers no
          # workflow, so the job-scoped GITHUB_TOKEN is the least privilege that
          # does the job; a PAT here would only widen it. The PAT this pipeline
          # does need is RELEASE_PLZ_TOKEN, which cuts the Release that starts
          # this workflow — see release-plz.yml and the note at the top.
          token: ${{ secrets.GITHUB_TOKEN }}

  # Post-upload gate: install the release that was just attached, the way the
  # README one-liner and the GitHub Action's default `version: latest` install it.
  #
  # `upload` proves the assets were attached; nothing proved they could be
  # *fetched under the names the installer builds*. That gap is why every release
  # through v0.1.11 shipped an installer that 404'd its own checksum and refused
  # to install — the archive downloaded fine, and `scripts/install.sh` asked for
  # `<archive>.tar.gz.sha256` where the upload publishes `<archive>.sha256`. The
  # dogfood workflow could not see it either: it runs `version: local`, which
  # compiles from source. So this leg runs the real script against the real
  # Release, then hands what it installed to the same smoke script the registry
  # verify jobs use.
  #
  # Ungated: a GitHub Release always publishes, whatever PYPI_PUBLISH and
  # NPM_PUBLISH say, so this leg always has something to install.
  #
  # Three legs, not four: `install.sh`'s ZIP branch needs `unzip` under a POSIX
  # shell, which the Windows image does not ship — the Windows install path the
  # README documents is `cargo install`, covered by ci.yml on windows-latest.
  verify-install:
    name: verify-install (${{ matrix.os }})
    needs: upload
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      # The installer and the smoke assets, at the tag that was published.
      - uses: actions/checkout@v4
      - name: Check the release tag is a version
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::release tag '$GITHUB_REF_NAME' is not a vX.Y.Z version tag"
            exit 1
          fi
      # Release assets are served from a CDN that converges after the upload API
      # answers, so the install is the propagation probe here for the same reason
      # it is for PyPI and npm — see scripts/retry-install.sh.
      - name: Install the published release with scripts/install.sh
        env:
          # Not needed to resolve a pinned tag, but install.sh sends it to
          # api.github.com alone and a future --version-less run would want it.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bash scripts/retry-install.sh \
            --label "GitHub Release notignored $GITHUB_REF_NAME on $RUNNER_OS/$RUNNER_ARCH" \
            --action "check the release's assets — upload may have attached no archive or no .sha256 for this target" \
            -- sh scripts/install.sh --version "$GITHUB_REF_NAME" --to "$RUNNER_TEMP/notignored-bin"
          echo "$RUNNER_TEMP/notignored-bin" >> "$GITHUB_PATH"
      # Single-shot, like every other post-install assertion: a wrong version or
      # a broken binary must fail now rather than be retried for ten minutes.
      - name: Smoke-test what the Release served
        run: |
          ver="${GITHUB_REF_NAME#v}"
          bash scripts/smoke-published.sh \
            --expect-version "$ver" \
            --label "GitHub Release notignored $ver on $RUNNER_OS/$RUNNER_ARCH"

  # crates.io publishing: runs whenever CARGO_REGISTRY_TOKEN is set. Gated on the
  # same `test` job as the binary upload, but NOT on `upload` — a flaky
  # per-platform upload must not block the immutable crate publish, and vice
  # versa. Kept out of release-plz (publish = false there) so versioning/tagging
  # stays decoupled from the registry push.
  publish-crate:
    needs: [guard, test]
    if: ${{ needs.guard.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # Idempotent: a version already live on crates.io is skipped rather than
      # failing the release, so re-running after a partial failure is safe.
      - name: Publish (skip a version already live)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          # `cargo publish` verifies the packaged crate by building it, which is
          # one more compile the gate never sees the output of.
          RUSTFLAGS: "-D warnings"
        run: |
          ver="$(cargo metadata --no-deps --format-version 1 \
                 | sed -n 's/.*"name":"notignored","version":"\([^"]*\)".*/\1/p')"
          if curl -fsSL "https://index.crates.io/no/ti/notignored" 2>/dev/null \
             | grep -q "\"vers\":\"$ver\""; then
            echo "notignored $ver is already on crates.io; nothing to publish."
            exit 0
          fi
          cargo publish --locked

  # PyPI wheels: maturin's `bin` bindings wrap the prebuilt binary in
  # per-platform wheels (the ruff/uv pattern), so `pip install notignored-cli` is
  # a seconds-fast binary install anywhere PyPI is reachable — the quickest path
  # on a CI image with no Rust toolchain. maturin-action compiles inside
  # manylinux containers on Linux for broad glibc compatibility, which is why
  # this is a separate matrix from `upload` rather than a step inside it.
  # `maturin-version` is the pin in .maturin-version, the same maturin
  # tests/e2e/packaging.rs builds the wheel with; tests/packaging_contract.rs
  # fails the build when the two drift.
  build-wheels:
    name: build-wheels (${{ matrix.target }})
    needs: test
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Mirrors the binary `upload` matrix: native runners per target.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build wheel
        # The gate denies warnings on Linux only; these targets are compiled
        # nowhere else, so deny them here too rather than let a
        # platform-specific one ship unread.
        env:
          RUSTFLAGS: "-D warnings"
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist
          manylinux: auto
          maturin-version: v1.14.1
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: dist

  # PyPI publishing activates when the PYPI_PUBLISH repository variable is
  # 'true'. Authentication is the PYPI_TOKEN secret (a project-scoped API token),
  # not Trusted Publishing: this project publishes with repo secrets, so no OIDC
  # identity is registered on PyPI and `id-token: write` would buy nothing.
  # Keeping the wheels' build unconditioned above means a packaging break still
  # reddens the release while publishing is off.
  publish-pypi:
    needs: build-wheels
    if: ${{ vars.PYPI_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    steps:
      # Switching PYPI_PUBLISH on is a claim that the credential exists. Say so
      # here rather than letting the upload fail later as an opaque 403 — the
      # live tier must require its credential, not discover it missing.
      - name: Require the publishing credential
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          if [ -z "${PYPI_TOKEN:-}" ]; then
            echo "::error::PYPI_PUBLISH is on but the PYPI_TOKEN secret is empty; add it (see gh-secrets.json) or unset PYPI_PUBLISH" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          password: ${{ secrets.PYPI_TOKEN }}
          # Idempotent: a re-run (e.g. to finish a sibling publish) must not
          # red-fail because these wheels are already on PyPI.
          skip-existing: true

  # Post-publish gate: prove the just-published version is pip-installable on
  # every OS a user installs it on. PyPI propagation is not instant, so the
  # install itself retries through scripts/retry-install.sh until the index a
  # user resolves from serves the version, then the real wheel it put on PATH
  # goes to scripts/smoke-published.sh — the same script,
  # fixture tree, and golden report tests/e2e/smoke.rs runs against the build
  # under test, so what a release asserts cannot drift from what ships. A failure
  # here means a broken release, not a blocked publish — the wheel is public
  # either way, so this is what turns "we uploaded something" into "it works".
  #
  # Four labels for five targets: `pip install` resolves a *different wheel* per
  # platform AND architecture, so the matrix is keyed on the pair, not the OS.
  # `macos-latest` is arm64 — `macos-15-intel` is the leg that installs the
  # `x86_64-apple-darwin` wheel, which nothing else here does. The one target
  # with no leg is `aarch64-unknown-linux-gnu`: setup-python's arm64 Linux
  # support is not something a release is the place to discover. It is still
  # built by the matrices above and installed for real by tests/e2e/packaging.rs
  # on whichever host runs it.
  verify-pypi:
    name: verify-pypi (${{ matrix.os }})
    needs: publish-pypi
    if: ${{ vars.PYPI_PUBLISH == 'true' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      # The smoke assets, at the tag that was published.
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # A Release can be cut by hand with any tag, and the version below is
      # sliced straight out of it — so check the shape before it becomes a
      # package specifier. Anything but vX.Y.Z means the Release is not one this
      # pipeline built.
      - name: Check the release tag is a version
        run: |
          # A glob cannot say "digits and nothing else" — `v[0-9]*.[0-9]*.[0-9]*`
          # would take `v1x.2y.3z` — so match the whole tag against a pattern.
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::release tag '$GITHUB_REF_NAME' is not a vX.Y.Z version tag"
            exit 1
          fi
      # The install is the propagation probe, and the only one: `pip install`
      # resolves through the simple index behind a CDN, which converges later
      # and per edge than the JSON API a separate wait step used to poll — so
      # that step printed "available" and this one then failed to find the
      # version, three releases running. scripts/retry-install.sh records them.
      #
      # `--no-cache-dir` because pip caches the index response it reads: a retry
      # that re-read its own cached "no such version" page would spend the whole
      # budget polling its own memory.
      - name: Install the published wheel
        run: |
          ver="${GITHUB_REF_NAME#v}"
          bash scripts/retry-install.sh \
            --label "PyPI notignored-cli $ver on $RUNNER_OS/$RUNNER_ARCH" \
            --action "check https://pypi.org/project/notignored-cli/ — publish-pypi may have uploaded no wheel for this platform" \
            -- pip install --no-cache-dir "notignored-cli==${ver}"
      - name: Smoke-test what PyPI served
        run: |
          ver="${GITHUB_REF_NAME#v}"
          bash scripts/smoke-published.sh \
            --expect-version "$ver" \
            --label "PyPI notignored-cli $ver on $RUNNER_OS/$RUNNER_ARCH"

  # The Python SDK: pure Python, so there is nothing to compile and one wheel
  # serves every platform. `scripts/python-sdk-build.mjs` stamps Cargo.toml's
  # version into the manifest and pins `notignored-cli` to that exact version,
  # which is what makes `pip install notignored-sdk` bring a binary that speaks
  # the report contract the SDK reads. Unconditioned like the other build jobs,
  # so a packaging break reddens a release even while publishing is off — and
  # `tests/test_packaging.py` builds this same wheel on every gate run, so what
  # ships here is what a pull request already proved.
  build-python-sdk:
    needs: test
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Stamp the crate version in and build the distributions
        run: |
          pkgdir="$(node scripts/python-sdk-build.mjs --out python/dist)"
          uv build --out-dir python-sdk-dist "$pkgdir"
      - uses: actions/upload-artifact@v4
        with:
          name: python-sdk
          path: python-sdk-dist/*

  # Published after `publish-pypi`, not beside it: the SDK's dependency is an
  # exact `notignored-cli==<version>`, so that version has to be resolvable
  # before this one is installable. Gated and tokened exactly like the wheels.
  publish-python-sdk:
    needs: [publish-pypi, build-python-sdk]
    if: ${{ vars.PYPI_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    steps:
      # Same rule as publish-pypi: the live tier requires its credential rather
      # than discovering it missing at the registry.
      - name: Require the publishing credential
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          if [ -z "${PYPI_TOKEN:-}" ]; then
            echo "::error::PYPI_PUBLISH is on but the PYPI_TOKEN secret is empty; add it (see gh-secrets.json) or unset PYPI_PUBLISH" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: python-sdk
          path: python-sdk-dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python-sdk-dist
          password: ${{ secrets.PYPI_TOKEN }}
          skip-existing: true

  # Post-publish gate: install what PyPI served and drive the SDK's public
  # surface through the binary its own dependency pulled in — the resolution this
  # job exists to prove. One runner, unlike verify-pypi's four: the SDK is a
  # single `py3-none-any` wheel, and the per-platform artifact underneath it is
  # the `notignored-cli` wheel that verify-pypi already installs on all four.
  verify-python-sdk:
    needs: publish-python-sdk
    if: ${{ vars.PYPI_PUBLISH == 'true' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      # For scripts/retry-install.sh, which every post-publish install goes
      # through — this job asserts in Python rather than through the smoke
      # script, but it races the same index.
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # A Release can be cut by hand with any tag, and the version below is
      # sliced straight out of it — so check the shape before it becomes a
      # package specifier.
      - name: Check the release tag is a version
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::release tag '$GITHUB_REF_NAME' is not a vX.Y.Z version tag"
            exit 1
          fi
      # Two packages have to have propagated for this to resolve — the SDK and
      # the `notignored-cli==<version>` it pins — and the install is what asks
      # both. Same probe, same cache reasoning, as verify-pypi.
      - name: Install the published SDK
        run: |
          ver="${GITHUB_REF_NAME#v}"
          bash scripts/retry-install.sh \
            --label "PyPI notignored-sdk $ver on $RUNNER_OS/$RUNNER_ARCH" \
            --action "check https://pypi.org/project/notignored-sdk/ and https://pypi.org/project/notignored-cli/ — the SDK pins the CLI at the same version, so either one missing fails this" \
            -- pip install --no-cache-dir "notignored-sdk==${ver}"
      # Single-shot on purpose: the install is what races the registry, and a
      # wrong version or a broken scan must fail now rather than be retried.
      - name: Scan with the CLI the SDK brought
        run: |
          ver="${GITHUB_REF_NAME#v}"
          python - "$ver" <<'PY'
          import sys
          from importlib.metadata import version
          from pathlib import Path
          from tempfile import TemporaryDirectory

          from notignored_sdk import Scope, Tool, scan

          expected = sys.argv[1]
          assert version("notignored-sdk") == expected, version("notignored-sdk")
          assert version("notignored-cli") == expected, version("notignored-cli")

          with TemporaryDirectory() as tmp:
              Path(tmp, "app.py").write_text("u = URL  # noqa: E501  # long URL\n")
              report = scan(cwd=tmp)

          assert report.version == 1, report
          assert [d.tool for d in report.ignores] == [Tool.RUFF], report
          assert report.ignores[0].rules == ("E501",), report
          assert report.ignores[0].reason == "long URL", report
          assert report.ignores[0].scope is Scope.LINE, report
          PY
          echo "PyPI install + packaged-CLI smoke test passed for notignored-sdk $ver"

  # npm packages: scripts/npm-build.mjs wraps the prebuilt binary in a
  # per-platform package (notignored-cli-<platform>-<arch>), the direct analogue
  # of the maturin wheels, on the same native-runner matrix as `upload`, then
  # `npm pack`s each to a tarball artifact. Unconditioned for the same reason the
  # wheels are.
  build-npm:
    name: build-npm (${{ matrix.target }})
    needs: test
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the platform binary
        env:
          TARGET: ${{ matrix.target }}
          # Same reason as the wheels: a warning that only this target emits has
          # no other job to surface it.
          RUSTFLAGS: "-D warnings"
        run: |
          rustup target add "$TARGET"
          cargo build --release --locked --target "$TARGET"
      - name: Assemble and pack the platform npm package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          bin="target/$TARGET/release/notignored"
          [ -f "$bin" ] || bin="${bin}.exe"
          pkgdir="$(node scripts/npm-build.mjs platform --target "$TARGET" --binary "$bin" --out npm/dist)"
          mkdir -p npm-artifacts
          (cd "$pkgdir" && npm pack --pack-destination "$GITHUB_WORKSPACE/npm-artifacts")
      - uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.target }}
          path: npm-artifacts/*.tgz

  # The TypeScript SDK (notignored-sdk). Pure JavaScript once compiled, so unlike
  # the launcher and the platform packages it needs no target matrix and no
  # prebuilt binary — it resolves whichever `notignored` its consumer installed.
  # Its version is stamped from Cargo.toml by the project's own pack script, the
  # same single-source rule the wheels and the launcher follow. Unconditioned for
  # the same reason build-npm is: a packaging break must redden a release even
  # while publishing is switched off.
  build-sdk-npm:
    needs: test
    permissions:
      contents: read
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: extractions/setup-just@v3
      # The SDK compiles with the repository's one pinned tsc, which this
      # installs; nothing else in this job needs a toolchain.
      - name: Install the pinned JS toolchain
        run: just setup-js
      - name: Build and pack the version-stamped SDK
        run: |
          just nx run notignored-sdk-npm:build
          pkgdir="$(node npm/notignored-sdk/scripts/pack.mjs --out npm/dist)"
          mkdir -p sdk-artifact
          (cd "$pkgdir" && npm pack --pack-destination "$GITHUB_WORKSPACE/sdk-artifact")
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-npm
          path: sdk-artifact/*.tgz

  # npm publishing activates when the NPM_PUBLISH repository variable is 'true'.
  # `registry-url` makes setup-node write an .npmrc that authenticates with
  # NODE_AUTH_TOKEN, so `npm publish` is token-authenticated (an npm automation
  # token with publish rights to notignored-cli and its platform packages).
  #
  # No `--provenance`: that needs an OIDC-backed attestation whose first
  # successful run cannot be rehearsed anywhere but a real publish, and a
  # provenance failure would take the publish down with it. The packages ship
  # without it rather than risk that; adding it later is a one-flag change plus
  # `id-token: write` on this job.
  publish-npm:
    needs: [build-npm, build-sdk-npm]
    permissions:
      contents: read
    if: ${{ vars.NPM_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # Same rule as publish-pypi: the live tier requires its credential rather
      # than discovering it missing at the registry. Without this, an empty
      # NODE_AUTH_TOKEN surfaces as an ENEEDAUTH inside publish-npm.sh, after
      # some packages may already be public.
      - name: Require the publishing credential
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "::error::NPM_PUBLISH is on but the NPM_TOKEN secret is empty; add it (see gh-secrets.json) or unset NPM_PUBLISH" >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - uses: actions/download-artifact@v4
        with:
          pattern: npm-*
          path: npm-artifacts
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdk-npm
          path: sdk-artifact
      - name: Publish the platform packages, then the launcher, then the SDK
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Platform packages first: the launcher's optionalDependencies pin their
          # exact versions, so they must exist for a later install to resolve.
          # Glob against an ABSOLUTE base so each argument is an absolute path —
          # npm reads a bare `dir/file.tgz` as a `user/repo` GitHub spec and tries
          # to git-clone it.
          for tgz in "$GITHUB_WORKSPACE"/npm-artifacts/*.tgz; do
            bash scripts/publish-npm.sh "$tgz"
          done
          # The launcher (notignored-cli) carries no binary, so it needs no
          # prebuilt target — just the version-stamped manifest.
          launcher="$(node scripts/npm-build.mjs launcher --out npm/dist)"
          bash scripts/publish-npm.sh "$launcher"
          # The SDK last: it depends on nothing here, but a consumer following
          # its README installs the launcher alongside it, so that has to resolve
          # by the time the SDK is on the registry.
          bash scripts/publish-npm.sh "$GITHUB_WORKSPACE"/sdk-artifact/*.tgz

  # Post-publish gate: prove the just-published version is npm-installable on
  # every OS a user installs it on, the same promise verify-pypi makes for the
  # wheel and on the same matrix, for the same reasons. Registry propagation is
  # not instant, so the global install retries through scripts/retry-install.sh
  # until it resolves, and the smoke test then drives the real binary its
  # optional dependency pulled in — which is the resolution this job exists to
  # prove, since npm picks a different platform package on each runner.
  verify-npm:
    name: verify-npm (${{ matrix.os }})
    needs: publish-npm
    if: ${{ vars.NPM_PUBLISH == 'true' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      # The smoke assets, at the tag that was published.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # A Release can be cut by hand with any tag, and the version below is
      # sliced straight out of it — so check the shape before it becomes a
      # package specifier. Anything but vX.Y.Z means the Release is not one this
      # pipeline built.
      - name: Check the release tag is a version
        run: |
          # A glob cannot say "digits and nothing else" — `v[0-9]*.[0-9]*.[0-9]*`
          # would take `v1x.2y.3z` — so match the whole tag against a pattern.
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::release tag '$GITHUB_REF_NAME' is not a vX.Y.Z version tag"
            exit 1
          fi
      # Same probe as verify-pypi: the install is what resolves the packument
      # and its platform dependency, so it is what waits for them rather than a
      # separate `npm view` poll that can answer from a different edge.
      # `--prefer-online` for the reason pip gets `--no-cache-dir` — npm will
      # otherwise serve the metadata it cached on the attempt that failed.
      - name: Install the published package
        run: |
          ver="${GITHUB_REF_NAME#v}"
          bash scripts/retry-install.sh \
            --label "npm notignored-cli $ver on $RUNNER_OS/$RUNNER_ARCH" \
            --action "check https://www.npmjs.com/package/notignored-cli — the platform package for this runner may not have published" \
            -- npm install -g --prefer-online "notignored-cli@${ver}"
      - name: Smoke-test what npm served
        run: |
          ver="${GITHUB_REF_NAME#v}"
          bash scripts/smoke-published.sh \
            --expect-version "$ver" \
            --label "npm notignored-cli $ver on $RUNNER_OS/$RUNNER_ARCH"
      # The SDK's own promise: installed from the registry, with the launcher
      # beside it, `scan` finds the binary and returns the record contract. That
      # resolution is per-platform — npm picks a different platform package on
      # each runner — so it is asserted on every leg rather than once.
      - name: Install the SDK from npm and scan through its packaged CLI
        run: |
          ver="${GITHUB_REF_NAME#v}"
          work="$(mktemp -d)"
          cd "$work"
          npm init --yes >/dev/null
          # An absolute path: this runs from a temp directory, not the checkout.
          bash "$GITHUB_WORKSPACE/scripts/retry-install.sh" \
            --label "npm notignored-sdk $ver on $RUNNER_OS/$RUNNER_ARCH" \
            --action "check https://www.npmjs.com/package/notignored-sdk — publish-npm publishes the SDK last, so it propagates last too" \
            -- npm install --prefer-online "notignored-sdk@${ver}" "notignored-cli@${ver}"
          printf 'x = 1  # noqa: E501  # smoke test\n' > app.py
          node --input-type=module -e '
            import { scan } from "notignored-sdk";
            const report = await scan(["app.py"]);
            const [directive] = report.ignores;
            if (report.ignores.length !== 1 || directive.tool !== "ruff"
                || directive.rules[0] !== "E501" || directive.reason !== "smoke test") {
              throw new Error(`installed SDK returned ${JSON.stringify(report)}`);
            }
          '
          echo "npm install + packaged-CLI smoke test passed for notignored-sdk $ver"

  # The GitHub Action's consumption ref. `uses: nickderobertis/notignored@v0` is
  # what the README tells consumers to write and what generated repositories
  # pin, so this is the last thing a release does: every publish and verify job
  # is a `needs:` of it, and `!failure()` is what turns that list into "none of
  # them failed". Without it a consumer could resolve `@v0` to a release whose
  # wheels or npm packages never reached a registry.
  #
  # `!failure() && !cancelled()` rather than a bare dependency list because most
  # of those jobs are *skipped* whenever PYPI_PUBLISH / NPM_PUBLISH is off, and a
  # skipped `needs:` would skip this job too — the tag would then never move on a
  # repository that publishes nothing but the GitHub Release. Skipped is fine;
  # failed is not.
  #
  # The major is derived from the tag inside the script, so `v1` starts moving at
  # 1.0.0 with nothing here to edit; tests/e2e/major_tag.rs drives that logic over
  # real repositories.
  major-tag:
    needs:
      - upload
      - verify-install
      - publish-crate
      - publish-pypi
      - verify-pypi
      - publish-python-sdk
      - verify-python-sdk
      - publish-npm
      - verify-npm
    if: ${{ !failure() && !cancelled() && !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    # Force-updating a tag is a write to refs/tags, and the only write this job
    # makes; the default GITHUB_TOKEN is enough, and a tag it pushes triggers no
    # workflow, which is what keeps this from re-entering the release.
    permissions:
      contents: write
    steps:
      # Full history and every tag: the script decides whether this release is
      # the newest one with its major, which a shallow checkout cannot answer.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move the floating major tag onto this release
        run: bash scripts/update-major-tag.sh --tag "$GITHUB_REF_NAME"
