name: Published smoke

# Install what the registries and the GitHub Release are serving *right now* and
# run it.
#
# `release.yml`'s verify jobs prove a version at the moment it is published, and
# then never look again. Everything that can break afterwards — a yanked platform
# package, an npm dist-tag moved to a build that never shipped, a wheel PyPI
# stopped serving for one platform — is invisible until a user hits it, because
# nothing in this repository installs from a registry between releases.
#
# So this runs the identical `scripts/smoke-published.sh` those jobs run, against
# `latest` rather than a tag, on Linux, both macOS architectures, and Windows,
# once a week. The registry's own idea of the version (`pip show`, `npm view`) is
# what the binary is held to, so a package whose metadata and payload disagree
# fails here rather than confusing someone reading `--version`.
#
# The third install surface is the GitHub Release itself, and until v0.1.12 it was
# the one nothing here or in `release.yml` ever exercised. `scripts/install.sh`
# asked for the checksum as `<archive>.tar.gz.sha256` while every release has ever
# published `<archive>.sha256`, so it 404'd and refused to install — on every
# release it had ever cut. Nothing caught it: the local suite served a fixture
# named after the script rather than after a release, and the dogfood workflow
# runs `version: local`, which compiles from source and never downloads anything.
# The `github-release` job below is that missing leg — the GitHub Action's own
# default install path, run against the live release.
#
# Deliberately cheap: a checkout, the language runtime that owns the installer,
# `pip install` / `npm install -g`, and bash. No Rust toolchain, no build, no
# cache — a sweep that took ten minutes a platform would be the first thing
# switched off, and this one has to keep running while nobody is looking.
#
# NOT a required check, and it cannot become one: branch protection lists
# contexts a *pull request* reports, and nothing here runs on one. See AGENTS.md.
#
# llmlint: ignore-file[changed_behavior_has_e2e] this workflow is a schedule, two
# registry installs, and a call to scripts/smoke-published.sh. The script is what holds
# the behaviour, and it is driven for real by tests/e2e/smoke.rs over the compiled
# binary — same file, same fixtures, same golden. What is left here is the trigger and
# the two installs, which only a hosted runner and a live registry can exercise;
# simulating either would put the simulation under test.
#
# llmlint: ignore-file[live_tier_compiles_and_requires_credential] there is no
# credential to require: every step reads a public registry anonymously, and the jobs
# are switched by the same PYPI_PUBLISH / NPM_PUBLISH repository variables that decide
# whether this project publishes to those registries at all. A repo that publishes
# nowhere has nothing to smoke, and a weekly red run for an absent package is how a
# sweep gets switched off.

on:
  schedule:
    # Mondays, early UTC: a break found at the start of the week gets a week to
    # be fixed in, and an off-the-hour minute keeps this out of the queue every
    # other cron job on GitHub is in.
    - cron: "23 6 * * 1"
  # The manual entry point — after a registry incident, or to confirm a fix
  # without waiting for Monday.
  workflow_dispatch:

# Nothing by default. Each job asks for `contents: read` because it checks out
# the smoke assets; nothing here writes anything.
permissions: {}

concurrency:
  group: published-smoke
  cancel-in-progress: false

jobs:
  # `curl … install.sh | sh`, on each OS, as a user runs it — and as the GitHub
  # Action's default `version: latest` runs it, since that step is literally
  # `sh "$GITHUB_ACTION_PATH/scripts/install.sh" --to …` with no version. This is
  # the leg whose absence let a 404 on the checksum ship through every release.
  #
  # Ungated by any repository variable, unlike the two registry jobs: a GitHub
  # Release needs no token to publish and no opt-in, so there is always one to
  # install and a red here is always real.
  #
  # No Windows leg. `install.sh`'s ZIP branch needs `unzip` under a POSIX shell,
  # which the Windows runner image does not ship; the install path the README
  # gives Windows users is `cargo install`, which `ci.yml`'s install jobs cover on
  # windows-latest. The `x86_64-pc-windows-msvc` asset names are held to the real
  # release manifest by tests/install_contract.rs instead.
  github-release:
    name: github-release (${{ matrix.os }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      # main's assets and main's installer: this sweep asks whether the script
      # users curl from main can install what the Release is serving today.
      - uses: actions/checkout@v4
      # GitHub's own idea of which release is latest, read independently of the
      # installer — the counterpart of `npm view` below. The installer resolves
      # `latest` for itself, so a disagreement between the two is a real finding:
      # it means the script installed something other than the newest release.
      - name: Ask GitHub which release is latest
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName | tr -d '\r')"
          if [ -z "$tag" ]; then
            echo "::error::GitHub Release on $RUNNER_OS/$RUNNER_ARCH: no published release to install"
            echo "ACTION: check https://github.com/$GITHUB_REPOSITORY/releases — release.yml may never have cut one" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      # No `--version`: this is byte-for-byte the GitHub Action's default install
      # step, which passes only `--to`. Resolving `latest` is part of what broke,
      # so it is part of what runs.
      - name: Install the latest release with scripts/install.sh
        env:
          # Lifts api.github.com's anonymous rate limit when install.sh resolves
          # "latest" — a shared-IP hosted runner hits it. The script sends this to
          # that host and to no other.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if ! sh scripts/install.sh --to "$RUNNER_TEMP/notignored-bin"; then
            echo "::error::GitHub Release on $RUNNER_OS/$RUNNER_ARCH: scripts/install.sh failed"
            echo "ACTION: check https://github.com/$GITHUB_REPOSITORY/releases/latest — the archive or its .sha256 sibling may be missing for this target" >&2
            exit 1
          fi
          echo "$RUNNER_TEMP/notignored-bin" >> "$GITHUB_PATH"
      # The same script, fixture tree, and golden the registry legs assert
      # through, so all three install surfaces are held to one definition of
      # "it works".
      - name: Smoke-test what the Release served
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          bash scripts/smoke-published.sh \
            --expect-version "${TAG#v}" \
            --label "GitHub Release notignored $TAG on $RUNNER_OS/$RUNNER_ARCH"

  # `pip install notignored-cli`, on each OS, as a user runs it.
  pypi:
    name: pypi (${{ matrix.os }})
    if: ${{ vars.PYPI_PUBLISH == 'true' }}
    permissions:
      contents: read
    strategy:
      # Every platform reports: the first red leg must not hide a second.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      # main's assets, on purpose: this sweep asks whether the *current* golden
      # still describes what the registry serves.
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the latest published wheel
        id: install
        run: |
          if ! pip install --upgrade notignored-cli; then
            echo "::error::PyPI on $RUNNER_OS/$RUNNER_ARCH: pip install notignored-cli failed"
            echo "ACTION: check https://pypi.org/project/notignored-cli/ for a yanked or missing wheel for this platform" >&2
            exit 1
          fi
          version="$(pip show notignored-cli | sed -n 's/^Version: //p' | tr -d '\r')"
          if [ -z "$version" ]; then
            echo "::error::PyPI on $RUNNER_OS/$RUNNER_ARCH: notignored-cli installed but reports no version"
            echo "ACTION: inspect the wheel's metadata — pip show found no Version field" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # The registry's version against the binary's own: a wheel whose metadata
      # says one thing and whose payload is another installs and runs perfectly.
      - name: Smoke-test what PyPI served
        env:
          VERSION: ${{ steps.install.outputs.version }}
        run: |
          bash scripts/smoke-published.sh \
            --expect-version "$VERSION" \
            --label "PyPI notignored-cli $VERSION on $RUNNER_OS/$RUNNER_ARCH"

  # `npm install -g notignored-cli`, on each OS, as a user runs it.
  npm:
    name: npm (${{ matrix.os }})
    if: ${{ vars.NPM_PUBLISH == 'true' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the latest published package
        id: install
        run: |
          version="$(npm view notignored-cli version 2>/dev/null | tr -d '\r')"
          if [ -z "$version" ]; then
            echo "::error::npm on $RUNNER_OS/$RUNNER_ARCH: the registry serves no version of notignored-cli"
            echo "ACTION: check https://www.npmjs.com/package/notignored-cli — the latest dist-tag may be unset or the package unpublished" >&2
            exit 1
          fi
          # Pinned to what `npm view` just reported so the version asserted below
          # is the one that was installed, even if latest moves mid-run. That
          # pin is also why this install retries: `npm view` and the install
          # resolve independently, so a version published minutes ago can be on
          # the edge one read and not the other — the same race that reddened
          # three releases, which scripts/retry-install.sh records.
          bash scripts/retry-install.sh \
            --label "npm notignored-cli $version on $RUNNER_OS/$RUNNER_ARCH" \
            --action "the platform package for this runner is missing or unpublished; check the notignored-cli-* packages" \
            -- npm install -g --prefer-online "notignored-cli@${version}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Smoke-test what npm served
        env:
          VERSION: ${{ steps.install.outputs.version }}
        run: |
          bash scripts/smoke-published.sh \
            --expect-version "$VERSION" \
            --label "npm notignored-cli $VERSION on $RUNNER_OS/$RUNNER_ARCH"
