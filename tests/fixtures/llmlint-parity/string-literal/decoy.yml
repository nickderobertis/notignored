# llmlint scans raw lines, so it reads the directives inside these strings and
# rejects the unknown rules they name. YAML has no comment in a quoted scalar,
# nor shell in a quoted string, so notignored never sees a directive there.
double: "a # llmlint: ignore[not_a_rule] inside a double-quoted scalar"
single: 'it''s # llmlint: ignore[not_a_rule] inside a single-quoted scalar'
multi: "first line
  # llmlint: ignore[not_a_rule] on a quoted scalar's continuation line"
script: |
  echo "# llmlint: ignore[not_a_rule] inside the script's own string"
