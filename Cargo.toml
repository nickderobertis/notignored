[package]
name = "notignored"
version = "0.1.15"
edition = "2021"
rust-version = "1.88"
description = "Extract lint and type-check suppression comments from source files natively and fast — no linter subprocesses."
license = "MIT"
repository = "https://github.com/nickderobertis/notignored"
homepage = "https://github.com/nickderobertis/notignored"
readme = "README.md"
keywords = ["cli", "lint", "noqa", "suppression", "code-review"]
categories = ["command-line-utilities", "development-tools"]
# Package what a consumer receives: the sources, manifest, readme, license — and
# the composite action's own surface, which ships at the git tag rather than in
# the archive. Excludes the CLAUDE.md/AGENTS.md symlink (registries reject
# symlinks), CI config, the other scripts, and the e2e fixtures.
#
# The action entries are here for release *scope*, not for the archive.
# release-plz decides a package changed by diffing its **packaged files** against
# the last release ("Getting packaged files for crate at …"), so a fix to
# `scripts/install.sh` — the default install path of `uses: nickderobertis/
# notignored@v0` — was invisible to it: v0.1.11's installer 404'd its own
# checksum, #42 fixed it, and release-plz opened no release PR, leaving `v0`
# pinned to the broken tree. Listing the action surface here is release-plz's own
# mechanism for that (it has no path-trigger config), and it costs three text
# files in the `.crate`. Anything else a consumer receives at the tag belongs
# here too; `tests/action_contract.rs`'s
# `every_file_the_action_runs_at_the_tag_is_release_relevant` holds the line.
#
# Anchored with a leading `/`: `include` takes gitignore patterns, so a bare
# `action.yml` would also match any nested one (which is why `README.md` above
# pulls in the SDKs' readmes).
include = [
  "src/**/*.rs",
  "Cargo.toml",
  "README.md",
  "LICENSE",
  "/action.yml",
  "/scripts/install.sh",
  "/scripts/action/comment.sh",
  "/scripts/action/counts.sh",
]
# `examples/` is documentation for the CLI — sample sources carrying the
# suppressions the README shows it reporting — not cargo examples. Left on,
# cargo would auto-discover the Rust one as a build target and compile a file
# that exists to be *scanned*.
autoexamples = false

[[bin]]
name = "notignored"
path = "src/main.rs"

[lib]
name = "notignored"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
# ANSI styling for the human report. Tiny and dependency-free — already in the
# tree via clap — so it adds color without growing the `cargo deny` surface. Pure
# style definitions; the TTY / `NO_COLOR` / `--color` decision lives in the CLI
# layer, never in the renderer.
anstyle = "1"
# The platform-correct sink for the colored report. `AutoStream` passes ANSI
# straight through on a VT-capable terminal but, on a *legacy* Windows console
# (no virtual-terminal processing), enables VT or translates the SGR codes into
# Win32 console attribute calls (`anstyle-wincon`) — so the colors render instead
# of printing as raw `←[31m` garbage. Already in the tree via clap (with its
# `wincon` default feature), so it adds no new `cargo deny` surface.
anstream = "1"
serde = { version = "1", features = ["derive"] }
# `preserve_order` keeps JSON object keys in insertion order so the report's
# field order matches the documented schema byte for byte, which is what the
# golden report test locks.
serde_json = { version = "1", features = ["preserve_order"] }
# The `.gitignore`-respecting parallel directory walker. Same crate ripgrep uses,
# so "recursive, respects .gitignore" means exactly what users expect.
ignore = "0.4"
thiserror = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[[test]]
name = "e2e"
path = "tests/e2e/main.rs"

# A CLI binary: optimize for a small, fast-starting artifact.
[profile.release]
strip = true
lto = "thin"
codegen-units = 1
