# Automated releases from conventional commits, driven by release-plz.
#
# Flow:
#   1. Commits land on `main` (pre-1.0: feat -> minor, fix/perf/refactor/build ->
#      patch, `!`/BREAKING -> minor; chore/docs/ci/test/style do not release).
#      release-plz only *sees* a commit that touched the crate's packaged files,
#      so what releases is governed by `[package] include` in Cargo.toml — which
#      is why the action's surface is listed there. See AGENTS.md.
#   2. The `release-pr` job opens/updates a PR that bumps the version in
#      Cargo.toml + Cargo.lock and writes the CHANGELOG section.
#   3. Merging that PR makes the `release` job push the `vX.Y.Z` tag and cut a
#      *draft* GitHub Release with the changelog notes. That tag (pushed with a
#      PAT, not the default GITHUB_TOKEN) triggers release.yml, which builds,
#      archives, checksums, and attaches the cross-platform binaries to the
#      draft, then publishes it.

[workspace]
# release-plz only versions, changelogs, tags, and cuts the GitHub Release — it
# never runs `cargo publish`. crates.io publishing is a separate step: the
# `publish-crate` job in release.yml, which self-activates when the
# CARGO_REGISTRY_TOKEN secret is set. Keeping it out of release-plz decouples
# versioning/tagging from the registry push.
publish = false

# API breaking-change detection (cargo-semver-checks) needs an extra tool and
# would block releases on any surface change; rely on review and the
# conventional-commit type instead (a `!` or `BREAKING CHANGE:` still bumps).
semver_check = false

git_tag_name = "v{{ version }}"
git_release_name = "v{{ version }}"

# Cut the Release as a draft. Release immutability is on for this repository,
# so a published Release accepts no asset: release.yml attaches every binary to
# the draft and publishes it once all of them are there. release-plz 0.3.158
# still pushes the tag itself (through the API, with the PAT) before it creates
# the draft, and that tag push is what starts release.yml. See AGENTS.md.
git_release_draft = true

# Keep-a-Changelog-style grouping. The version bump is computed from the
# conventional-commit *type*, independent of these display groups.
[changelog]
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Changed" },
  { message = "^docs", group = "Documentation" },
  { message = "^test", skip = true },
  { message = "^ci", skip = true },
  { message = "^chore", skip = true },
  { message = "^build", skip = true },
  { message = "^style", skip = true },
  { body = ".*", group = "Other" },
]
